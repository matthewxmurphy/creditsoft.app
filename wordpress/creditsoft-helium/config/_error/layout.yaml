version: 2
preset:
  name: _error
layout:
  /navigation/:
    - [creditsoft-header-1001]
  /container-main/:
    -
      - 'mainbar 100':
          - [system-content-1002]
  /footer/:
    - [creditsoft-footer-1003]
structure:
  navigation:
    type: section
    subtype: div
    attributes:
      boxed: ''
      class: creditsoft-navigation
  mainbar:
    type: section
    subtype: main
    attributes:
      class: creditsoft-main
  container-main:
    attributes:
      boxed: ''
  footer:
    type: section
    subtype: div
    attributes:
      boxed: ''
      class: creditsoft-footer-section
content:
  creditsoft-header-1001:
    title: CreditSoft header
  creditsoft-footer-1003:
    title: CreditSoft footer
