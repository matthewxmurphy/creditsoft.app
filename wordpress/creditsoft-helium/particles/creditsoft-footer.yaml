name: CreditSoft Footer
description: Editable public copy and native WordPress footer menu locations.
type: particle
icon: fa-columns
form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      default: true
    image:
      type: input.imagepicker
      label: Wordmark
      default: gantry-theme://assets/creditsoft-wordmark.png
    summary:
      type: textarea.textarea
      label: Summary
    contact:
      type: input.text
      label: Public contact address
