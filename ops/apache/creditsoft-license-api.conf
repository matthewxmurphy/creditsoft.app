<VirtualHost *:80>
    ServerName api.creditsoft.app
    ServerAlias api.creatorpublishinghub.com
    ServerAlias api.net30hosting.com
    ServerAlias api.matthewxmurphy.com
    DocumentRoot /var/www/0abb0757-d06a-4da8-b26e-ff885980834e/public_html

    <Directory /var/www/0abb0757-d06a-4da8-b26e-ff885980834e/public_html>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/?\.well-known/acme-challenge/ - [END]
    RewriteRule ^ https://api.creditsoft.app%{REQUEST_URI} [R=308,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/sites/creditsoft-license-api-error.log
    CustomLog ${APACHE_LOG_DIR}/sites/creditsoft-license-api-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.creditsoft.app
    ServerAlias api.creatorpublishinghub.com
    ServerAlias api.net30hosting.com
    ServerAlias api.matthewxmurphy.com
    DocumentRoot /var/www/0abb0757-d06a-4da8-b26e-ff885980834e/public_html
    DirectoryIndex index.php

    <Directory /var/www/0abb0757-d06a-4da8-b26e-ff885980834e/public_html>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    RewriteEngine On
    RewriteRule ^/?(?:license/validate(?:\.json)?|api/verify)/?$ /api/license-validate.php [END]
    RewriteRule ^/?api/license-validate\.php$ - [END]
    RewriteRule ^ - [R=404,L]

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/creditsoft-license-api/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/creditsoft-license-api/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/sites/creditsoft-license-api-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/sites/creditsoft-license-api-ssl-access.log combined
</VirtualHost>
</IfModule>
