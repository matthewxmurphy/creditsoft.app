<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CreditSoft Companion</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f0e2;
      --panel: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(27, 24, 20, 0.12);
      --ink: #1f1a17;
      --muted: rgba(31, 26, 23, 0.62);
      --soft: rgba(31, 26, 23, 0.07);
      --accent: #f5b223;
      --accent-ink: #2a1904;
      --success: #2f9f5b;
      --warning: #d97706;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    html {
      border-radius: 32px;
      overflow: hidden;
      background: transparent;
    }

    body {
      margin: 0;
      width: 420px;
      max-height: 620px;
      border-radius: 32px;
      overflow: hidden;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
    }

    .shell {
      margin: 8px;
      padding: 12px;
      display: grid;
      gap: 10px;
      border-radius: 30px;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(245, 178, 35, 0.18), transparent 28%),
        radial-gradient(circle at right top, rgba(31, 26, 23, 0.08), transparent 26%),
        var(--bg);
      box-shadow: 0 16px 40px rgba(31, 26, 23, 0.16);
    }

    .panel {
      max-height: 604px;
      border-radius: 22px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(31, 26, 23, 0.08);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .header {
      padding: 10px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header img {
      display: block;
      width: 154px;
      height: auto;
      max-width: 100%;
    }

    .brand-menu {
      position: relative;
      min-width: 0;
    }

    .logo-button {
      border: 0;
      border-radius: 14px;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: transform 140ms ease, opacity 140ms ease;
    }

    .logo-button:hover {
      transform: translateY(-1px);
      opacity: 0.88;
    }

    .integration-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 40;
      width: min(286px, calc(100vw - 44px));
      display: grid;
      gap: 8px;
      padding: 8px;
      border-radius: 18px;
      border: 1px solid rgba(31, 26, 23, 0.12);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 18px 40px rgba(31, 26, 23, 0.18);
    }

    .integration-menu[hidden] {
      display: none;
    }

    .integration-menu-item {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(31, 26, 23, 0.1);
      background: rgba(255, 250, 235, 0.96);
      color: var(--ink);
      padding: 10px 12px;
      text-align: left;
      display: grid;
      gap: 3px;
    }

    .integration-menu-item span {
      font-size: 13px;
      font-weight: 800;
    }

    .integration-menu-item small {
      font-size: 11px;
      line-height: 1.35;
      color: var(--muted);
    }

    .integration-menu-note {
      margin: 0;
      padding: 0 4px 2px;
      font-size: 10px;
      line-height: 1.35;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .paired-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(31, 26, 23, 0.18);
      box-shadow: 0 0 0 3px rgba(31, 26, 23, 0.08);
    }

    .paired-dot.ready {
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(47, 159, 91, 0.16);
    }

    .paired-dot.saved {
      background: var(--warning);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.16);
    }

    .paired-dot.error {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.16);
    }

    .icon-button {
      border: 0;
      background: transparent;
      color: var(--ink);
      width: 30px;
      height: 30px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 25px;
      line-height: 1;
      transition: transform 140ms ease, background 140ms ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      background: transparent;
    }

    .body {
      min-height: 0;
      overflow-y: auto;
      padding: 0 12px 12px;
      display: grid;
      gap: 10px;
      align-content: start;
      scrollbar-width: thin;
    }

    .eyebrow {
      margin: 0 0 2px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .title {
      margin: 0;
      font-size: 13px;
      line-height: 1.25;
      font-weight: 700;
    }

    .subtle {
      margin: 4px 0 0;
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted);
    }

    .search-wrap {
      display: grid;
      gap: 8px;
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    input,
    select,
    textarea {
      width: 100%;
      border-radius: 15px;
      border: 1px solid rgba(31, 26, 23, 0.14);
      background: rgba(255, 255, 255, 0.96);
      color: var(--ink);
      font: inherit;
      padding: 11px 12px;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(245, 178, 35, 0.82);
      box-shadow: 0 0 0 4px rgba(245, 178, 35, 0.16);
    }

    textarea {
      min-height: 68px;
      resize: vertical;
    }

    select {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(31, 26, 23, 0.55) 50%),
        linear-gradient(135deg, rgba(31, 26, 23, 0.55) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 3px),
        calc(100% - 12px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 34px;
    }

    button {
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, opacity 140ms ease, box-shadow 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .primary {
      background: var(--ink);
      color: white;
      padding: 9px 14px;
      min-height: 36px;
      box-shadow: 0 8px 18px rgba(31, 26, 23, 0.14);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      border: 1px solid rgba(31, 26, 23, 0.12);
      padding: 11px 14px;
    }

    .ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(31, 26, 23, 0.1);
      padding: 11px 14px;
    }

    button[data-icon-class],
    button.primary[data-icon-class],
    button.secondary[data-icon-class],
    button.ghost[data-icon-class] {
      display: inline-flex;
      width: 30px;
      height: 30px;
      min-width: 30px;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: rgba(31, 26, 23, 0.72);
      box-shadow: none;
    }

    button[data-icon-class]:hover,
    button.primary[data-icon-class]:hover,
    button.secondary[data-icon-class]:hover,
    button.ghost[data-icon-class]:hover {
      color: var(--accent-ink);
      background: transparent;
      box-shadow: none;
    }

    button[data-icon-class]:focus-visible {
      outline: 2px solid rgba(245, 178, 35, 0.78);
      outline-offset: 3px;
    }

    button[data-icon-class] i {
      display: inline-flex;
      width: 18px;
      height: 18px;
      align-items: center;
      justify-content: center;
      color: currentColor;
      font-style: normal;
      line-height: 1;
    }

    button[data-icon-class] i svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .results,
    .selected {
      display: grid;
      gap: 8px;
    }

    .result-button,
    .selected-card {
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      border-radius: 16px;
      border: 1px solid rgba(31, 26, 23, 0.1);
      background: rgba(255, 255, 255, 0.92);
    }

    .result-button:hover {
      border-color: rgba(31, 26, 23, 0.18);
      background: rgba(255, 255, 255, 1);
    }

    .result-top,
    .selected-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .name {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .meta {
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted);
      margin-top: 4px;
    }

    .tiny-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      background: rgba(245, 178, 35, 0.14);
      color: var(--accent-ink);
    }

    .selected-card {
      border-color: rgba(245, 178, 35, 0.32);
      background: rgba(255, 250, 235, 0.95);
    }

    .selected-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .field-group {
      display: grid;
      gap: 8px;
    }

    .credential-card {
      display: grid;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 18px;
      border: 1px solid rgba(31, 26, 23, 0.1);
      background: rgba(255, 255, 255, 0.8);
    }

    .credential-card[hidden],
    .credential-panel[hidden] {
      display: none;
    }

    .credential-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .credential-panel {
      display: grid;
      gap: 8px;
    }

    .credential-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field-label {
      margin: 0;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    details {
      border-radius: 16px;
      border: 1px solid rgba(31, 26, 23, 0.1);
      background: rgba(255, 255, 255, 0.78);
      padding: 10px 12px;
    }

    summary {
      cursor: pointer;
      list-style: none;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      align-items: center;
    }

    .status {
      min-height: 18px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      margin: 0;
    }

    .status:empty {
      display: none;
    }

    .status[data-tone="success"] {
      color: var(--success);
    }

    .status[data-tone="error"] {
      color: var(--danger);
    }

    .status[data-tone="warn"] {
      color: #9a6700;
    }

    .empty {
      padding: 12px;
      border-radius: 16px;
      border: 1px dashed rgba(31, 26, 23, 0.16);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="header">
        <div class="brand-menu">
          <button id="integrationMenuToggle" class="logo-button" type="button" aria-label="Open import systems menu" aria-expanded="false" aria-controls="integrationMenu">
            <img src="creditsoft-wordmark.png" alt="CreditSoft">
          </button>
          <div id="integrationMenu" class="integration-menu" hidden>
            <button id="openDisputeFoxImport" class="integration-menu-item" type="button">
              <span>Migrate Pulse</span>
              <small>One-time Pulse import lane. Use the side panel Migrate button for the full pass.</small>
            </button>
            <p class="integration-menu-note">More credit repair systems can plug into this same customer import lane later.</p>
          </div>
        </div>
        <div class="header-actions">
          <span id="pairedDot" class="paired-dot" aria-label="CreditSoft API key status" role="status"></span>
          <button id="openSettings" class="icon-button" type="button" aria-label="Open extension settings" title="Open extension settings" data-icon-class="fa-solid fa-gear" data-label="Open extension settings"></button>
        </div>
      </div>

      <div class="body">
        <section class="search-wrap">
          <div>
            <p class="eyebrow">Client</p>
            <p class="title">Choose client from CreditSoft</p>
          </div>

          <div class="input-row">
            <select id="clientSelect" aria-label="Client">
              <option value="">Load clients from CreditSoft</option>
            </select>
            <button id="refreshClients" class="secondary" type="button" aria-label="Reload clients from CreditSoft" title="Reload clients from CreditSoft" data-icon-class="fa-solid fa-rotate" data-label="Reload clients from CreditSoft"></button>
          </div>

          <div id="clientEmpty" class="empty">Save a CreditSoft API key, then load clients from CreditSoft.</div>
          <div id="selectedClient" class="selected" hidden></div>
        </section>

        <section id="credentialFeature" class="credential-card" hidden>
          <div class="credential-top">
            <div>
              <p class="eyebrow">Pulse migration</p>
              <p class="subtle">Local credentials only. Use Sync page here, or open the side panel to run the full migration.</p>
            </div>
          </div>

          <div id="credentialPanel" class="credential-panel" hidden>
            <input id="disputefoxUsername" type="text" placeholder="Pulse username" autocomplete="username">
            <input id="disputefoxPassword" type="password" placeholder="Pulse password" autocomplete="current-password">
            <div class="credential-actions">
              <button id="saveDisputeFoxCredentials" class="secondary" type="button" aria-label="Save DisputeFox credentials in this browser only" title="Save DisputeFox credentials in this browser only" data-icon-class="fa-regular fa-floppy-disk" data-label="Save DisputeFox credentials"></button>
              <button id="syncDisputeFoxFiles" class="secondary" type="button" aria-label="Download and reattach files from the current DisputeFox profile" title="Download and reattach files from the current DisputeFox profile" data-icon-class="fa-regular fa-folder" data-label="Download DisputeFox files"></button>
              <button id="syncDisputeFoxProfile" class="primary" type="button" aria-label="Sync the current DisputeFox profile page" title="Sync the current DisputeFox profile page" data-icon-class="fa-solid fa-rotate" data-label="Sync current DisputeFox profile"></button>
            </div>
          </div>
        </section>

        <section class="actions">
          <button id="goCapture" class="primary" type="button" aria-label="Send the current provider page to CreditSoft" title="Send the current provider page to CreditSoft" data-icon-class="fa-solid fa-play" data-label="Send current page to CreditSoft"></button>
        </section>

        <p id="status" class="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="fontawesome-lite.js"></script>
  <script src="popup.js"></script>
</body>
</html>
